appId: ${APP_ID}
---

# --- Enter Card Number ---
- scrollUntilVisible:
    element:
      id: ${output.checkout.creditCard.cardNumberField}
- tapOn:
    id: ${output.checkout.creditCard.cardNumberField}
    label: "Tap Card Number field"
- inputText:
    text: ${CARD_NUMBER}
    label: "Enter card number"

# --- Select expiry month and year ---
- scrollUntilVisible:
    element:
      id: ${output.checkout.creditCard.expiryMonthYearField}
- tapOn:
    id: ${output.checkout.creditCard.expiryMonthYearField}
    label: "Tap Expiry MM/YY field"
- inputText:
    text: ${EXPIRY_MONTHYEAR}
    label: "Enter expiry month and year"

# --- Enter CVC ---
- scrollUntilVisible:
    element:
      id: ${output.checkout.creditCard.cvcField}
- tapOn:
    id: ${output.checkout.creditCard.cvcField}
    label: "Tap CVC field"
- inputText:
    text: ${CVC}
    label: "Enter CVC"

# --- Enter Zip Code ---
- scrollUntilVisible:
    element:
      id: ${output.checkout.creditCard.postalCodeField}
- tapOn:
    id: ${output.checkout.creditCard.postalCodeField}
    label: "Tap Postal Code field"
- inputText:
    text: ${POSTAL_CODE}
    label: "Enter Postal Code"

